name: Feature workspace transfer

on:
  push:
    branches: ['feat/required-features-20261015']
    paths: ['.github/workflows/feature-workspace-transfer.yml']

permissions:
  contents: read

jobs:
  workspace:
    name: Transfer committed public source for local development
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Read the exact task revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Create and verify the development bundle
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git --version
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p "$RUNNER_TEMP/worldlens-source-transfer"
          git update-ref refs/heads/source-transfer "$SOURCE_COMMIT"
          git bundle create "$RUNNER_TEMP/worldlens-source-transfer/worldlens-source.bundle" refs/heads/source-transfer
          git bundle verify "$RUNNER_TEMP/worldlens-source-transfer/worldlens-source.bundle"
          printf '%s\n' "$SOURCE_COMMIT" > "$RUNNER_TEMP/worldlens-source-transfer/source-commit.txt"
          cd "$RUNNER_TEMP/worldlens-source-transfer"
          sha256sum worldlens-source.bundle > SHA256SUMS
      - name: Retain the bounded development transfer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worldlens-source-transfer-${{ github.sha }}
          path: ${{ runner.temp }}/worldlens-source-transfer/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
