name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Nominate this dispatch to publish if the exact commit has no release yet
        required: false
        default: true
        type: boolean

# No *workflow*-level concurrency group: a run is never wholesale-cancelled by a later one.
#
# There used to be a workflow-level group here with `cancel-in-progress` switched off, and
# it did not hold. Over one afternoon of frequent pushes, every single run on main was
# cancelled at the exact second the next one was created, and the branch went a long stretch
# with no green and no red at all - which reads as "verified" to anybody glancing at it, and
# is worse than a failure, because a failure is at least visible. A shared group also holds
# **one** pending run, so a third arrival evicts the queued middle one even with cancellation
# switched off - avoided the same way, by not sharing a group at all.
#
# The `concurrency` blocks below stay scoped per job, never to the whole workflow.
# A job-level group only supersedes that same job across runs - it can never cancel a
# *different* job in the *same* run the way a shared workflow-level group would, so jobs
# meant to run in parallel (`workflows`, `check` and `jars` all start together below) still
# do. `release` deliberately carries none of these new groups: it already has its own
# job-level group further down with `cancel-in-progress: false`, for the reason recorded
# there - a queued publish waits, it is never dropped, and nothing above cancels it either.

permissions:
  contents: read

jobs:
  # A workflow file with an invalid expression is not a workflow that fails - it is a
  # workflow that never registers. It disappears from the Actions list, `gh workflow run`
  # reports it as not found, and the only symptom is a zero-second "workflow file issue"
  # hung on some unrelated push. `Render world` shipped in that state and nobody could
  # have told from a green CI run, because nothing here ever read those files.
  #
  # This job reads them. It is deliberately first and deliberately cheap: it needs no
  # checkout of anything but the workflows and no toolchain at all.
  workflows:
    name: Lint the workflow files
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-workflows-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # Full history and every tag: the changelog check below derives its versions from
      # the tags and its entries from the commits, and a depth-1 checkout would report a
      # changelog covering one version as current.
      #
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          # Pull requests are otherwise checked out at GitHub's synthetic merge
          # commit. The generated changelog follows the branch history, so lint
          # the actual PR head instead of inventing an unlisted merge entry.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Guard executable workflow expressions and release metadata
        run: |
          set -euo pipefail
          node --test scripts/bootstrap.test.mjs scripts/collect-squirrel-release.test.mjs scripts/lint-workflows.test.mjs scripts/pick-dim-sum.test.mjs scripts/release-asset-manifest.test.mjs
          node scripts/lint-workflows.mjs

      # There is deliberately NO changelog freshness check here, and the reason is worth
      # recording so nobody adds one back without solving it first.
      #
      # `build-changelog.mjs` records unreleased commits as well as released versions, so
      # its output changes with every push - including the push that regenerates it. A
      # check over that output is unsatisfiable by construction: regenerate, commit, and
      # the commit you just made is the one now missing. It failed the first build it ever
      # ran in, on the commit that had just brought the changelog up to date.
      #
      # Making it satisfiable means grading only the released history, which is the part a
      # reader relies on and the part that changes only when a tag appears. Until the
      # generator can render that half on its own, a gate here would fail every build,
      # which teaches people to ignore a red X rather than to keep the changelog current.
      # Regenerate with `node scripts/build-changelog.mjs` when cutting a release.

      - name: actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          curl -fsSL --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" \
            | sha256sum --check --strict -
          tar -xzf actionlint.tar.gz actionlint
          # The hosted runner already ships shellcheck, so every run block is checked.
          # (This note deliberately never starts a line with the word shellcheck: a
          # comment starting "# shellcheck" is parsed as a shellcheck *directive*, and a
          # malformed one fails the very lint step this comment sits in.)
          ./actionlint -color

  check:
    name: Lint, build, test
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-check-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: design
    env:
      # packages/config's vendor cross-checks (schema.test.ts, controlPolicy.test.ts)
      # read the vendored BlueMap Java to prove defaults, controls and doc text against
      # upstream itself rather than a hand-transcribed copy - see test/vendorGate.ts.
      # Unset, a submodule that failed to fetch is a named skip indistinguishable in a
      # green run from "optional and intentionally absent". Set here, that same absence
      # is a real, visible failure instead.
      MBM_VENDOR_REQUIRED: "1"
    steps:
      # The vendored BlueMap submodule used to be skipped here as a large Java reference
      # tree nothing in the build read - but packages/config's cross-checks above now
      # read it, and MBM_VENDOR_REQUIRED turns its absence into a hard failure rather
      # than a silent skip, so it has to be fetched. `fetch-depth: 1` (also the default)
      # is passed explicitly because actions/checkout applies that same depth to the
      # submodule fetch: this pulls the one commit's tree rather than the submodule's
      # full history, which matters because that tree is 500+ MB.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false

      # No `version:` input: the workspace pins the exact pnpm build it wants
      # (`packageManager: "pnpm@10.33.0"` in design/package.json), and pnpm/action-setup
      # reads that field itself when pointed at the file - `package_json_file` because the
      # manifest lives in `design/`, not at the repository root the action defaults to.
      # This installs the pinned version regardless of whatever pnpm (if any) is already
      # in this job, without hand-duplicating the version number here for
      # it to drift out of sync with the manifest later.
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: design/package.json

      # Matches design/package.json's `"engines": { "node": ">=22" }`. Kept as an explicit
      # version rather than a range lookup: setup-node's own version-file resolution is
      # documented for exact pins and `.nvmrc`-style files, not proven here for a bare
      # `>=` range, and 22 is already the exact floor the manifest declares.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: design/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm screenshots:check
      - run: pnpm lint
      - run: pnpm build
      # After `build`, never before: a package resolves a sibling `@worldlens/*`
      # through that sibling's emitted `dist/*.d.ts`, so on a clean checkout every
      # cross-package import is a "cannot find module" until the build has run.
      #
      # It is a separate step from `build` because building does not type-check
      # everything: `ui` goes through Vite, which transpiles file by file and never
      # checks a template, and plain `tsc` cannot read a `.vue` import at all — so that
      # one package runs `vue-tsc` instead.
      #
      # `NODE_OPTIONS` raises Node's default old-space limit for this step alone. The
      # an earlier constrained runner died here with
      # `FATAL ERROR: Reached heap limit Allocation failed - JavaScript heap out of
      # memory` (exit 134). `vue-tsc` holds the whole `ui` package's type graph in one
      # process, that package grew a great deal, and a hosted runner's Node was sizing
      # its heap against a machine with more headroom than this one has to spare.
      # Scoped to the step rather than the job so nothing else inherits a raised
      # ceiling it never needed.
      - run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      # `test:ci`, not `test`: every one of the last several CI runs died the same
      # way - every test file and every test reported passed, and the only failure
      # was vitest's own worker-to-main RPC heartbeat (an unhandled error reading
      # [vitest-worker]: Timeout calling "onTaskUpdate", a 60s deadline hardcoded
      # in this vitest version with no config knob). scripts/run-tests-ci.mjs runs
      # the real `vitest run` and retries a clean attempt only on that exact
      # signature - zero failed files, zero failed tests, that one RPC error -
      # never on an actual failing test. `pnpm test` (plain `vitest run`) stays
      # the local/dev command.
      #
      # Same heap story as the typecheck step above, and found the same way: with
      # typecheck fixed, the very next run died here instead with "Ineffective
      # mark-compacts near heap limit". The suite is over eight thousand tests across
      # nearly six hundred files; vitest's own config already caps the worker pool at
      # two forks precisely so this machine is not asked to hold more at once. Raising
      # the ceiling here lifts the main process and the forks it spawns together,
      # because a child inherits NODE_OPTIONS.
      - run: pnpm test:ci
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  package:
    name: Windows installer
    # Needs `jars` too: the CLI jar downloaded below is what makes local rendering work
    # in the packaged app at all. Without it electron-builder still produces an
    # installer, but every local render in that installer fails immediately with
    # "The BlueMap engine is not installed" - see jars.ts and orchestrator.ts.
    needs: [check, jars]
    runs-on: windows-2022
    concurrency:
      group: ci-package-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Version pinned via design/package.json's own `packageManager` field - see the
      # comment on the same step in the `check` job above for why.
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: design/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: design/pnpm-lock.yaml

      - name: Install
        working-directory: design
        run: pnpm install --frozen-lockfile

      # The app bundles the workspace packages, so they have to be built first.
      - name: Build workspace
        working-directory: design
        run: pnpm build

      - name: Download the CLI jar built by the jars job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bluemap-jar-cli
          path: jar-download

      - name: Download the jar digest index built by the jars job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bluemap-jar-index
          path: jar-index

      # jars.ts's bundledJarDirectory() reads resources/jars in a packaged build, and
      # electron-builder.config.cjs's extraResources copies this exact staging
      # directory there - the same directory `tools/build-jars.mjs` stages into on a
      # workstation, so a packaged build and a local checkout resolve the CLI jar the
      # same way. actions/upload-artifact does not guarantee the jar lands at the
      # artifact's top level, so the recursive search locates it rather than assuming a path.
      - name: Stage the CLI jar to bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools/oracle/out/jars | Out-Null
          $jar = Get-ChildItem -LiteralPath jar-download -Recurse -File -Filter '*.jar' | Select-Object -First 1
          if (-not $jar) {
            Write-Host '::error::the bluemap-jar-cli artifact contained no .jar file'
            exit 1
          }
          $index = Get-Content -LiteralPath jar-index/bluemap-jars.json -Raw | ConvertFrom-Json
          $record = @($index.jars | Where-Object { $_.implementation -eq 'cli' })
          if ($record.Count -ne 1 -or $record[0].fileName -ne $jar.Name) {
            Write-Host '::error::the CLI jar does not match the same-run digest index'
            exit 1
          }
          $actual = (Get-FileHash -LiteralPath $jar.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $record[0].sha256) {
            Write-Host '::error::the CLI jar failed its same-run SHA-256 provenance check'
            exit 1
          }
          Copy-Item -LiteralPath $jar.FullName -Destination tools/oracle/out/jars/
          Get-ChildItem -LiteralPath tools/oracle/out/jars

      # Every build must carry a version Squirrel can order, or installing a newer
      # release over an older one silently does nothing: same version, nothing to do,
      # no error and no upgrade. `0.1.<run number>` is monotonic, is valid semver, and
      # is valid NuGet, which Squirrel requires.
      - name: Stamp this build's version
        id: version
        shell: pwsh
        working-directory: design/packages/app
        run: |
          $base = node -p "require('./package.json').version.split('.').slice(0,2).join('.')"
          if ($base -notmatch '^[0-9]+\.[0-9]+$') {
            Write-Host '::error::application package version is outside the supported major.minor schema'
            exit 1
          }
          if ($env:GITHUB_RUN_NUMBER -notmatch '^[1-9][0-9]{0,17}$') {
            Write-Host '::error::GITHUB_RUN_NUMBER is not a bounded positive integer'
            exit 1
          }
          $version = "$base.$env:GITHUB_RUN_NUMBER"
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,4)+String.fromCharCode(10));" $version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "building installer version $version"

      - name: Prepare one fresh Squirrel release set
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          node scripts/collect-squirrel-release.mjs prepare `
            --package-dir design/packages/app `
            --output installer-out `
            --state "$env:RUNNER_TEMP/worldlens-squirrel-build.json" `
            --version "$env:PACKAGE_VERSION"

      - name: Build Squirrel.Windows installer
        working-directory: design/packages/app
        run: pnpm run make

      - name: Collect installer artifacts
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          node scripts/collect-squirrel-release.mjs collect `
            --package-dir design/packages/app `
            --output installer-out `
            --state "$env:RUNNER_TEMP/worldlens-squirrel-build.json" `
            --version "$env:PACKAGE_VERSION"

      - name: Prove generated Windows executables are unsigned and branded
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $applicationCandidates = @(
            'design/packages/app/release/win-unpacked/Worldlens.exe',
            'design/packages/app/dist/win-unpacked/Worldlens.exe'
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }
          if ($applicationCandidates.Count -ne 1) {
            Write-Host "::error::expected one packaged Worldlens.exe, found $($applicationCandidates.Count)"
            exit 1
          }
          $releaseExecutables = @(Get-ChildItem -LiteralPath installer-out -File -Filter '*.exe')
          if ($releaseExecutables.Count -lt 1) {
            Write-Host '::error::the collected Squirrel set contains no setup executable'
            exit 1
          }
          $executables = @((Get-Item -LiteralPath $applicationCandidates[0])) + $releaseExecutables
          foreach ($executable in $executables) {
            $signature = Get-AuthenticodeSignature -LiteralPath $executable.FullName
            if ($signature.Status -ne 'NotSigned') {
              Write-Host "::error::$($executable.Name) has Authenticode status $($signature.Status); signing is prohibited"
              exit 1
            }
          }
          $versionInfo = $executables[0].VersionInfo
          if ($versionInfo.ProductName -ne 'Worldlens' -or $versionInfo.FileDescription -ne 'Worldlens') {
            Write-Host '::error::the resource-only branding hook did not apply Worldlens metadata'
            exit 1
          }
          if (-not $versionInfo.ProductVersion.StartsWith($env:PACKAGE_VERSION)) {
            Write-Host "::error::packaged product version $($versionInfo.ProductVersion) does not match $env:PACKAGE_VERSION"
            exit 1
          }
          Write-Host "verified $($executables.Count) generated executable(s): Worldlens-branded and NotSigned"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: installer-out/
          if-no-files-found: error
          retention-days: 30

  # The renderer itself: all seven BlueMap implementations, built from the vendored
  # upstream source. Decision D18 makes the six Minecraft-server adapters product
  # artefacts alongside the CLI, so they are built on every push and attached to every
  # release. It is a called workflow rather than a separate one on its own trigger,
  # which is what puts its artifacts in this run where the release job can reach them.
  # Independent of `check`, so it runs beside the TypeScript build instead of after it.
  jars:
    name: BlueMap jars
    uses: ./.github/workflows/build-jars.yml
    # A job-level group works the same on a job that calls a reusable workflow as on any
    # other job - see the top-of-file comment for why this is per-job rather than a single
    # workflow-level group.
    concurrency:
      group: ci-jars-${{ github.ref }}
      cancel-in-progress: true

  # packages/config/test/javaRoundTrip.test.ts is the one test that proves the whole
  # point of the HOCON reader/writer: it generates a config set, edits real values
  # through this package's own reader/writer (the same code path the options GUI
  # uses), hands the folder to the *real* upstream CLI jar, and asserts the edited
  # values - including map sort order - round-tripped correctly into the CLI's own
  # settings.json. It is describe.skipIf(!runnable) gated on a CLI jar plus a `java`
  # on PATH, and until now nothing in this workflow ever gave it either, so it was a
  # named skip on every hosted run - a proof that only ever ran on somebody's laptop.
  #
  # A separate job rather than adding this to `check`: `check` already runs on every
  # push and is the fast lint/build/test loop everyone waits on, while `jars` is a
  # full Gradle build of upstream (cold-cache ceiling: 120 minutes, see
  # build-jars.yml). Making `check` depend on `jars` would serialise the pipeline and
  # tack that build onto the front of every single push's feedback, warm cache or
  # not. This job needs only `jars`, runs beside `check` rather than after it, and on
  # the common warm-cache path finishes in well under a minute past `jars` itself.
  config-java-roundtrip:
    name: Config / real Java CLI round trip
    needs: [jars]
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-config-java-roundtrip-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Version pinned via design/package.json's own `packageManager` field - see the
      # comment on the same step in the `check` job above for why.
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: design/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: design/pnpm-lock.yaml

      # Upstream pins JavaLanguageVersion.of(25) (buildSrc/bluemap.java.gradle.kts,
      # see build-jars.yml), and the shadow jar's own class files require exactly
      # that version - not merely "some JVM".
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bluemap-jar-cli
          path: jar-download

      - name: Install
        working-directory: design
        run: pnpm install --frozen-lockfile

      # javaRoundTrip.test.ts resolves its jar from BLUEMAP_CLI_JAR when set (see the
      # test file's own findCliJar()), so pointing that at the artifact this job just
      # downloaded is the whole gate: cliJar !== null, hasJava() true, runnable true,
      # describe.skipIf(!runnable) actually runs instead of recording a named skip.
      # `find`, not an assumed path: actions/upload-artifact does not guarantee the
      # jar lands at the download's top level.
      - name: Run the real Java CLI round-trip test
        working-directory: design
        shell: bash
        run: |
          set -euo pipefail
          jar=$(find "$GITHUB_WORKSPACE/jar-download" -name '*.jar' | head -1)
          if [ -z "$jar" ]; then
            echo "::error::the bluemap-jar-cli artifact contained no .jar file"
            exit 1
          fi
          echo "Using CLI jar: $jar"
          BLUEMAP_CLI_JAR="$jar" npx vitest run packages/config/test/javaRoundTrip.test.ts

  # A world of our own, rendered by the Java engine, so the screenshot harness never
  # touches somebody else's public demo server. Closes issue #17: every push used to
  # pull map tiles from bluecolored.de, which is another person's bandwidth, made the
  # captures depend on a third party's uptime, and let a screenshot of a fully rendered
  # world imply this project had rendered it.
  test-world:
    name: Generate and render a test world
    needs: [check, jars]
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-test-world-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Version pinned via design/package.json's own `packageManager` field - see the
      # comment on the same step in the `check` job above for why.
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: design/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: design/pnpm-lock.yaml

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bluemap-jar-cli
          path: jar

      - name: Install and build
        working-directory: design
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # A different seed every push, derived from the run id so it is fresh but
      # recorded and reproducible rather than merely random.
      - name: Generate the world
        id: world
        run: |
          set -euo pipefail
          seed=$(( GITHUB_RUN_ID % 2147483647 ))
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "Generating a 1000x1000 world with seed $seed"
          node design/packages/worldgen/dist/cli.js             --seed "$seed" --size 1000 --out "$GITHUB_WORKSPACE/test-world"
          ls -la "$GITHUB_WORKSPACE/test-world"

      - name: Render it with the Java engine
        id: render
        run: |
          set -euo pipefail
          # Absolute, because the render below runs from a different working directory
          # and a relative jar path stops resolving the moment we cd.
          jar=$(find "$GITHUB_WORKSPACE/jar" -name '*.jar' | head -1)
          world=$(find "$GITHUB_WORKSPACE/test-world" -maxdepth 1 -type d -name 'test-world-seed-*' | head -1)
          config="$GITHUB_WORKSPACE/render-config"
          out="$GITHUB_WORKSPACE/render-out"
          mkdir -p "$out"

          # Generate the config set, then point it at our world. Absolute paths
          # throughout: the CLI resolves its storage root against the working
          # directory, not the config folder it was given.
          java -jar "$jar" -c "$config" || true
          sed -i 's/^accept-download: false/accept-download: true/' "$config/core.conf"
          sed -i "s|^world: .*|world: \"$world\"|" "$config/maps/overworld.conf"
          mv "$config/maps/nether.conf" "$config/maps/nether.conf.off"
          mv "$config/maps/end.conf" "$config/maps/end.conf.off"

          cd "$out"
          java -jar "$jar" -c "$config" -r -g
          echo "tiles=$(find "$out/web/maps" -name '*.prbm*' | wc -l)" >> "$GITHUB_OUTPUT"
          du -sh "$out/web"

      - name: Record what rendered it
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/render-out/provenance.json" <<JSON
          {
            "engine": "upstream BlueMap Java engine, built from the vendored source",
            "seed": ${{ steps.world.outputs.seed }},
            "sizeBlocks": 1000,
            "hiresTiles": ${{ steps.render.outputs.tiles }},
            "commit": "${{ github.sha }}",
            "run": "${{ github.run_id }}"
          }
          JSON
          cat "$GITHUB_WORKSPACE/render-out/provenance.json"

      - name: Package the world for the release
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/test-world"
          zip -qr "$GITHUB_WORKSPACE/test-world-seed-${{ steps.world.outputs.seed }}.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum test-world-seed-*.zip > test-world.sha256.txt
          ls -la "$GITHUB_WORKSPACE"/test-world-seed-*.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-world
          path: |
            test-world-seed-*.zip
            test-world.sha256.txt
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rendered-map
          path: |
            render-out/web
            render-out/provenance.json
          if-no-files-found: error
          retention-days: 7

  screenshots:
    name: Screenshots
    needs: [check, test-world]
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-screenshots-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Version pinned via design/package.json's own `packageManager` field - see the
      # comment on the same step in the `check` job above for why.
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: design/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: design/pnpm-lock.yaml

      - name: Install
        working-directory: design
        run: pnpm install --frozen-lockfile

      # This project has hit a specific failure mode before: npm/pnpm's install-script
      # gate can leave the `electron` package present in node_modules while its
      # postinstall binary download never ran, so `electron/dist/` has no actual
      # executable - Playwright then reports a confusing `exitCode=127` from
      # `electron.launch()` thirty lines later with no indication that the real
      # problem was a missing download rather than, say, a missing shared library
      # (see the GTK check further down, which is the *other* known cause of that
      # same exit code). `require('electron')` is the identical resolution
      # `_electron.launch()` performs internally and returns the binary path
      # directly, so this checks the exact thing about to be launched, before
      # Playwright ever tries it. If the download is missing, its own install.js is
      # re-run once as a repair attempt before failing loudly.
      - name: Verify the Electron binary was actually downloaded
        working-directory: design/packages/app
        run: |
          set -euo pipefail
          electron_bin=$(node -e "console.log(require('electron'))")
          if [ -x "$electron_bin" ]; then
            echo "electron binary present: $electron_bin"
          else
            echo "electron binary missing at $electron_bin; re-running its postinstall download"
            electron_pkg_dir=$(node -e "console.log(require('path').dirname(require.resolve('electron/package.json')))")
            node "$electron_pkg_dir/install.js"
            if [ ! -x "$electron_bin" ]; then
              echo "::error::the electron binary at $electron_bin is still missing after re-running $electron_pkg_dir/install.js - this is a genuine download failure, not an install-script skip that a retry can fix"
              exit 1
            fi
            echo "electron binary present after repair: $electron_bin"
          fi

      - name: Build workspace
        working-directory: design
        run: pnpm build

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rendered-map
          path: rendered-map

      # The wizard's later steps read a real world through the main process, so
      # without one they photograph nothing and are recorded as skipped. This job
      # already had the rendered map; the world that produced it is an artifact of
      # the same run, so fetch that too rather than leaving four captures out of
      # every build.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-world
          path: test-world-zip

      - name: Unpack the world the map was rendered from
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/capture-world"
          # `find`, not `ls`: shellcheck refuses the latter here (SC2012), and it is right
          # that parsing `ls` output breaks on names this job does not control.
          zip=$(find test-world-zip -maxdepth 1 -type f -name 'test-world-seed-*.zip' | head -1)
          test -n "$zip"
          unzip -q "$zip" -d "$GITHUB_WORKSPACE/capture-world"
          world=$(find "$GITHUB_WORKSPACE/capture-world" -maxdepth 2 -type f -name level.dat -printf '%h\n' | head -1)
          test -n "$world"
          echo "CAPTURE_WORLD=$world" >> "$GITHUB_ENV"
          ls -la "$world"

      - name: Install Playwright browsers' OS dependencies
        working-directory: design/packages/app
        run: pnpm exec playwright install-deps chromium

      # Electron needs a display. xvfb gives it one without a desktop session.
      # `local` mode serves the map this run rendered, so the captures are
      # self-contained and reproducible, and the network guard fails the job if the
      # app reaches the public internet at all during capture.
      - name: Capture
        working-directory: design/packages/app
        env:
          WORLDLENS_CAPTURE_MODE: local
          WORLDLENS_CAPTURE_MAP: ${{ github.workspace }}/rendered-map/web
          WORLDLENS_CAPTURE_PROVENANCE: ${{ github.workspace }}/rendered-map/provenance.json
          WORLDLENS_CAPTURE_WORLD: ${{ env.CAPTURE_WORLD }}
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" pnpm run screenshots

      # Upload even when the capture failed: a diagnostic image of a broken
      # window is exactly the evidence needed to fix it.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screenshots
          path: design/packages/app/screenshots/
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: screenshot-traces
          path: design/packages/app/test-results/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish release
    # config-java-roundtrip proves the config writer's real behaviour against the real
    # upstream Java CLI (see that job's own comment above) - without this gate, a release
    # could ship a config writer that silently fails to round-trip a value into the CLI's
    # own settings.json, a defect a user would hit the moment they saved a setting through
    # the app. That is worth blocking a release over, so it is listed here rather than left
    # as a separate, ungated proof.
    #
    # The added wall-clock is effectively zero. config-java-roundtrip needs only `jars`
    # (same as `check`) and finishes in well under a minute once `jars` is ready - 28
    # seconds observed end to end in run 31051809784, since all it does past that point is
    # download one jar, set up a JDK and run one vitest file. Every other job already
    # listed here takes longer on its own: `check` takes 7+ minutes when it passes,
    # `package` is a full Windows electron-builder build that runs several minutes on top
    # of that, and `test-world` is a real Java world render at around 6 minutes. Since
    # `release` already waits on all three, config-java-roundtrip is never the slowest
    # input it is blocked on - it is done long before the others are.
    needs: [check, workflows, package, jars, test-world, config-java-roundtrip, screenshots]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_release == true)
    runs-on: ubuntu-24.04
    # This job deliberately carries no `ci-release-*-cancel-in-progress-true` group like
    # the other jobs in this file now do (see the top-of-file comment): that pattern
    # exists to clear a pileup of *stale* work, and a publish already in flight is never
    # stale. The group below is the one that already existed for a different reason and
    # is unrelated to runner selection - kept exactly as it was.
    #
    # The one thing that genuinely cannot run twice at once, and not for the reason it
    # looks like. The tag is `v<version>-build.<run number>`, which is unique per run, so
    # two releases could never collide on it.
    #
    # The dim sum code name can. It is chosen from the ordinal below, and the ordinal is
    # `how many releases exist right now` - so two publishes in flight together read the
    # same count, pick the same dish, and ship two different builds under one code name,
    # which is the single thing a code name exists to prevent.
    #
    # `cancel-in-progress: false` because a queued publish must wait, never be dropped. A
    # group holds one pending run, so three publishes racing can still evict the middle;
    # that is a narrower window than the whole workflow had, and the honest fix for it is
    # an ordinal that does not depend on a live count. Recorded rather than papered over.
    concurrency:
      group: ci-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # The line counter attributes surviving lines with `git blame`, so it
      # needs the full history rather than a shallow clone.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # The release scripts only read local history. Leaving the write-scoped
          # checkout credential in .git/config would give every later shell step a
          # credential it neither declares nor needs.
          persist-credentials: false

      # pnpm before setup-node, so the node cache can key off the lockfile. Version
      # pinned via design/package.json's own `packageManager` field - see the comment on
      # the same step in the `check` job above for why.
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: design/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: design/pnpm-lock.yaml

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer
          path: installer-out

      # The seven jars were uploaded one artifact per implementation so a person can
      # take only the one their server needs; here they are collected back into one
      # directory, together with the checksums and the release-notes section the build
      # wrote from the jars it had actually produced.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bluemap-jar-*
          merge-multiple: true
          path: jars-out

      # A world anybody can render themselves, with the seed stated so the exact one
      # in this release can be regenerated byte for byte.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-world
          path: world-out

      # Artifact upload and download is a round trip through someone else's storage, and
      # a jar that arrives short is a download that fails on a stranger's server rather
      # than here. The digests were taken from the bytes the build produced, so checking
      # them proves what is about to be published is what was actually built.
      - name: Verify the jars survived the artifact round trip
        shell: bash
        run: |
          set -euo pipefail
          cd jars-out
          shopt -s nullglob
          jars=(bluemap-*.jar)
          if [ "${#jars[@]}" -ne 7 ]; then
            echo "::error::expected all seven BlueMap jars, found ${#jars[@]}. A release must not ship a partial set."
            ls -la
            exit 1
          fi
          sha256sum -c bluemap-jars.sha256.txt
          ls -la

      - name: Verify installer and test-world artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          (cd installer-out && sha256sum -c installer-out.sha256.txt)
          (cd world-out && sha256sum -c test-world.sha256.txt)

      # A GitHub release asset is capped at 2 GB, and a rendered world is tens of
      # gigabytes of tiles. Anything over the cap is published as 1.7 GB parts beside a
      # manifest and put back together by the consumer, so the splitter has to be built
      # before the release is composed. `--ignore-scripts` skips Electron's binary
      # download, which is the slow part of an install and is not needed to run `tsc`.
      - name: Build the archive splitter
        working-directory: design
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @worldlens/parts run build

      # Nothing happens here on an ordinary build: every asset this release carries today
      # is far under the cap, `split` stays 0, and the notes below say nothing about
      # splitting. The step exists for the day a rendered world is attached.
      - name: Split oversized release assets
        id: split
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p split-out
          split_any=0
          split_names=()
          for asset in installer-out/* jars-out/bluemap-*.jar world-out/*.zip; do
            [ -f "$asset" ] || continue
            size=$(stat -c%s "$asset")
            if [ "$size" -le 2000000000 ]; then
              continue
            fi
            echo "$asset is $size bytes, over the 2 GB release-asset cap; splitting it."
            node scripts/split-parts.mjs "$asset" --out split-out
            # The oversized original is removed so the publish globs below cannot pick
            # it up and hand GitHub a file it is certain to refuse.
            rm -f "$asset"
            split_any=1
            split_names+=("$(basename "$asset")")
          done
          if [ "$split_any" -eq 1 ]; then
            ls -la split-out
            printf 'names=%s\n' "$(IFS=,; echo "${split_names[*]}")" >> "$GITHUB_OUTPUT"
          fi
          echo "split=$split_any" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./design/package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::design/package.json has a release version outside the supported schema"
            exit 1
          fi
          if [[ ! "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]{0,17}$ ]]; then
            echo "::error::GITHUB_RUN_NUMBER is not a bounded positive integer"
            exit 1
          fi
          mapfile -t existing_tags < <(
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -r --arg sha "$GITHUB_SHA" '.[][] | select(.draft == false and .target_commitish == $sha) | .tag_name'
          )
          if [ "${#existing_tags[@]}" -gt 1 ]; then
            echo "::error::commit $GITHUB_SHA already has ${#existing_tags[@]} releases; refusing to add another"
            printf '%s\n' "${existing_tags[@]}"
            exit 1
          fi
          if [ "${#existing_tags[@]}" -eq 1 ]; then
            {
              printf 'publish=false\n'
              printf 'tag=%s\n' "${existing_tags[0]}"
            } >> "$GITHUB_OUTPUT"
            echo "exact commit $GITHUB_SHA is already nominated by ${existing_tags[0]}; this run will not duplicate it"
            exit 0
          fi
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists; refusing to recycle a published release"
            exit 1
          fi
          # The release ordinal drives the dim sum code name. It is monotonic, so
          # a dish is never silently reused, and no ledger has to be committed
          # back by CI, which would be an automation loop.
          count=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100000 --json tagName --jq 'length')
          if [[ ! "$count" =~ ^[0-9]{1,6}$ ]] || [ "$count" -gt 999999 ]; then
            echo "::error::release inventory count is not a bounded non-negative integer"
            exit 1
          fi
          ordinal=$((count + 1))
          {
            printf 'publish=true\n'
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$version"
            printf 'ordinal=%s\n' "$ordinal"
          } >> "$GITHUB_OUTPUT"

      - name: Verify nominated release already exists
        if: steps.tag.outputs.publish == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName,targetCommitish,body,assets > existing-release.json
          node scripts/release-asset-manifest.mjs verify-nomination \
            --metadata existing-release.json \
            --commit "$GITHUB_SHA" \
            --tag "$RELEASE_TAG"

      # Not a gate: a release must never be blocked because the photo catalog is
      # unavailable. A failure here is reported in the notes instead.
      # Expressions stay in env mappings, never executable text: the catalog values
      # come from another repository and Actions substitutes run-block expressions
      # before bash parses them.
      - name: Resolve dim sum code name
        if: steps.tag.outputs.publish == 'true'
        id: dish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
          ORDINAL: ${{ steps.tag.outputs.ordinal }}
        run: node scripts/pick-dim-sum.mjs --ordinal "$ORDINAL"

      - name: Prepare release payload and hash manifest
        if: steps.tag.outputs.publish == 'true'
        env:
          BLUEMAP_VERSION: ${{ needs.jars.outputs.version }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [[ ! "$BLUEMAP_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::BlueMap version is outside the bounded archive-name schema"
            exit 1
          fi

          jars="bluemap-server-plugins-${BLUEMAP_VERSION}"
          rm -rf -- "$jars"
          mkdir -p "$jars"
          cp jars-out/bluemap-*.jar jars-out/bluemap-jars.sha256.txt jars-out/bluemap-jars.json "$jars/"
          {
            printf 'BlueMap %s server plugins\n\n' "$BLUEMAP_VERSION"
            cat <<'TXT'

          One jar per Minecraft server platform, built from the upstream source
          vendored in this repository. Take only the one your server runs:

            bluemap-*-paper.jar     Paper
            bluemap-*-spigot.jar    Spigot
            bluemap-*-fabric.jar    Fabric
            bluemap-*-forge.jar     Forge
            bluemap-*-neoforge.jar  NeoForge
            bluemap-*-sponge.jar    Sponge
            bluemap-*-cli.jar       command line renderer, no server needed

          Verify with bluemap-jars.sha256.txt. These are builds of upstream BlueMap,
          not a reimplementation.
          TXT
          } > "$jars/README.txt"
          zip -qr "$jars.zip" "$jars"

          extras="worldlens-${RELEASE_TAG}-extras"
          rm -rf -- "$extras"
          mkdir -p "$extras"/{test-world,update}
          cp world-out/*.zip "$extras/test-world/"
          cp installer-out/*.nupkg installer-out/RELEASES "$extras/update/"
          if [ -e installer-out/Squirrel.exe ]; then
            cp installer-out/Squirrel.exe "$extras/update/"
          fi
          {
            printf 'Worldlens %s - extras\n\n' "$RELEASE_TAG"
            cat <<'TXT'

          test-world/  A Minecraft save this project generated in anvil format, with
                       the seed in its file name. No Minecraft installation and no
                       Mojang download are needed to render it.
          update/      Squirrel update files that accompany the installer. You do not
                       need these to install; they are here so the set is complete.

          The installer and the server plugins are separate downloads on the release
          page.
          TXT
          } > "$extras/README.txt"
          zip -qr "$extras.zip" "$extras"

          assets=(installer-out/*Setup.exe installer-out/*-full.nupkg installer-out/RELEASES)
          assets+=(installer-out/*-delta.nupkg)
          assets+=("$jars.zip" "$extras.zip" jars-out/bluemap-jars.sha256.txt)
          assets+=(split-out/*)
          node scripts/release-asset-manifest.mjs create \
            --manifest release-assets.json \
            --markdown release-assets.md \
            -- "${assets[@]}"

      - name: Compose release notes
        if: steps.tag.outputs.publish == 'true'
        env:
          DISH_NAME_EN: ${{ steps.dish.outputs.dish_name_en }}
          DISH_NAME_ZH: ${{ steps.dish.outputs.dish_name_zh }}
          DISH_ALT_EN: ${{ steps.dish.outputs.dish_alt_en }}
          DISH_PHOTO_URL: ${{ steps.dish.outputs.dish_photo_url }}
          SPLIT: ${{ steps.split.outputs.split }}
          SPLIT_NAMES: ${{ steps.split.outputs.names }}
        run: |
          set -euo pipefail
          {
            if [ -n "$DISH_NAME_EN" ]; then
              printf '**Code name: %s · %s**\n\n' "$DISH_NAME_EN" "$DISH_NAME_ZH"
              printf '![%s](%s)\n\n' "$DISH_ALT_EN" "$DISH_PHOTO_URL"
              # The backticks are literal Markdown delimiters in a static format.
              # shellcheck disable=SC2016
              printf 'Photo remains a public release asset in the `Ding-Ding-Projects/dim-sum-photos` catalog. Worldlens links to that authoritative asset and does not download, copy, or attach it.\n'
            else
              echo "> [!NOTE]"
              echo "> No dim sum code name or public photo link is shown: catalog resolution failed. The \`Resolve dim sum code name\` step has the exact status. No substitute was generated, downloaded, copied, or attached."
            fi
            echo
            echo "## Install"
            echo
            echo "Download the Squirrel.Windows installer below. Windows only for now; macOS and Linux packaging land in a later phase."
            echo
            echo "> [!WARNING]"
            echo "> Worldlens for Windows is intentionally and permanently unsigned. Windows SmartScreen may warn that the publisher is unknown; review the exact SHA-256 digest on this release before choosing to run it. The Squirrel package hash detects changed bytes, but an unsigned package does not authenticate who published or authored those bytes."
            echo
            echo "The seven \`bluemap-*.jar\` files are a separate download and are not needed to install the desktop application. Take one only to run BlueMap on a Minecraft server or from a command line; the table below says which is which."
            echo
            cat jars-out/bluemap-jars.md
            if [ "$SPLIT" = "1" ]; then
              echo "## One download arrived in pieces"
              echo
              # The backticks are literal Markdown delimiters in a static format.
              # shellcheck disable=SC2016
              printf 'A GitHub release asset cannot be larger than 2 GB, and this one is: `%s`. It is published as `<name>.001`, `<name>.002`, ... beside a `<name>.parts.json` that carries the size and SHA-256 of every part and of the whole file.\n' \
                "$SPLIT_NAMES"
              echo
              echo "**In the desktop application**, nothing has to be done: it finds the manifest, downloads every part with resume, checks each one, rejoins them and unpacks the result."
              echo
              echo "**By hand**, download every numbered part and the \`.parts.json\` into one directory, then run:"
              echo
              echo '```sh'
              echo "node scripts/join-parts.mjs <name>.parts.json"
              echo '```'
              echo
              echo "It verifies each part as it appends it and the whole file at the end, names the exact part if one is wrong, and picks up where it left off if it is interrupted."
              echo
            fi
            echo "## What is in this build"
            echo
            echo "Commit \`${GITHUB_SHA}\` on \`main\`, built and tested by [run ${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). This release exists only because workflow lint, application lint, build, typecheck, the full test suite, Java round-trip, real world render, Windows packaging, and screenshot capture all passed first."
            echo
            node scripts/count-lines.mjs --format=markdown
            echo
            cat release-assets.md
            echo
            echo "## Changelog"
            echo
            echo "Changelog commit: \`${GITHUB_SHA}\`. Every entry is grouped and linked by full SHA in [\`CHANGELOG.md\`](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/CHANGELOG.md) at this exact commit. Regenerated by hand with \`node scripts/build-changelog.mjs\` before a release is cut; \`--check\` proves a given commit's copy is current but does not run as a CI gate (see \`Lint the workflow files\` for why)."
          } > release-notes.md
          echo "Composed $(wc -l < release-notes.md) lines of release notes"

      - name: Publish
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(
            node scripts/release-asset-manifest.mjs list --manifest release-assets.json
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::the validated release manifest contains no assets"
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Worldlens $RELEASE_TAG" \
            --notes-file release-notes.md \
            "${assets[@]}"

          if [ -e release-readback ]; then
            echo "::error::release readback directory already exists"
            exit 1
          fi
          mkdir release-readback
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-readback
          node scripts/release-asset-manifest.mjs verify \
            --manifest release-assets.json \
            --directory release-readback

          # The first job's startedAt is read from the run itself rather than inferred
          # from this job's clock. The completion value is accepted only when release
          # note publication and exact metadata readback finish in that same UTC second.
          workflow_started=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[] | select(.startedAt != null and .startedAt != "0001-01-01T00:00:00Z") | .startedAt] | sort | .[0]')
          if [ -z "$workflow_started" ] || [ "$workflow_started" = "null" ]; then
            echo "::error::could not resolve the first job start time for end-to-end release timing"
            exit 1
          fi
          workflow_started_epoch=$(date -u -d "$workflow_started" +%s)
          cp release-notes.md release-notes-without-timing.md
          for attempt in 1 2 3 4 5; do
            workflow_completed=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            workflow_completed_epoch=$(date -u -d "$workflow_completed" +%s)
            workflow_duration_seconds=$((workflow_completed_epoch - workflow_started_epoch))
            if [ "$workflow_duration_seconds" -lt 0 ]; then
              echo "::error::workflow timing went backwards: $workflow_started -> $workflow_completed"
              exit 1
            fi
            workflow_duration=$(printf '%02d:%02d:%02d' \
              $((workflow_duration_seconds / 3600)) \
              $(((workflow_duration_seconds % 3600) / 60)) \
              $((workflow_duration_seconds % 60)))
            {
              cat release-notes-without-timing.md
              echo
              echo "## Workflow timing"
              echo
              echo "- Workflow started: $workflow_started"
              echo "- Workflow completed: $workflow_completed"
              echo "- Workflow duration: $workflow_duration"
            } > release-notes.md
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file release-notes.md
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,tagName,targetCommitish,body,assets \
              > release-metadata.json
            node scripts/release-asset-manifest.mjs verify-metadata \
              --metadata release-metadata.json \
              --manifest release-assets.json \
              --commit "$GITHUB_SHA" \
              --tag "$RELEASE_TAG" \
              --notes release-notes.md
            observed_completion=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            if [ "$observed_completion" = "$workflow_completed" ]; then
              exit 0
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::release-note publication crossed a UTC second boundary five times"
              exit 1
            fi
          done
