<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawing board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0E11}
a{color:#8FCDFF}a:hover{color:#CEE5FF}
</style>
</helmet>
<div style="min-height: 800px; box-sizing: border-box; padding: 32px; background: #0B0E11; color: #E1E2E8; font-family: Roboto, sans-serif; display: flex; flex-direction: column; gap: 16px">
  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 32px; font-weight: 400">Annotate</h1>
      <p style="margin: 0; font-size: 14px; color: #C2C7CF">Bayville spawn, rendered 7 Nov · strokes stay on this PC</p>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <button aria-label="Undo, Ctrl+Z" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #1D2024; color: #E1E2E8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg></button>
      <button aria-label="Redo, Ctrl+Shift+Z" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #1D2024; color: #E1E2E8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 14l5-5-5-5"></path><path d="M20 9H9a5 5 0 0 0 0 10h3"></path></svg></button>
      <button style="height: 40px; padding: 0 16px; border: 1px solid #8C9199; border-radius: 20px; background: transparent; color: #8FCDFF; font: 500 14px Roboto, sans-serif">Export SVG</button>
      <button style="height: 40px; padding: 0 20px; border: 0; border-radius: 20px; background: #8FCDFF; color: #003351; font: 500 14px Roboto, sans-serif">Export PNG 2x</button>
    </div>
  </header>
  <div style="position: relative; flex: 1; min-height: 560px; border-radius: 24px; overflow: hidden; background: #2A2E33">
    <div aria-hidden="true" style="position: absolute; inset: 0; background-image: linear-gradient(#323539 1px, transparent 1px), linear-gradient(90deg, #323539 1px, transparent 1px); background-size: 48px 48px; opacity: .6"></div>
    <div aria-hidden="true" style="position: absolute; left: 22%; top: 18%; width: 46%; height: 52%; border-radius: 8px; background: #3B5E3A"></div>
    <div aria-hidden="true" style="position: absolute; left: 40%; top: 30%; width: 18%; height: 22%; border-radius: 4px; background: #6B6156"></div>
    <svg role="img" aria-label="Two annotations: a circle around spawn and an arrow to the river" viewBox="0 0 1000 560" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%">
      <path d="M455 205c60-30 140-10 150 50s-60 95-130 85-95-75-60-120" fill="none" stroke="#FFB4AB" stroke-width="6" stroke-linecap="round"></path>
      <path d="M640 380 L780 450" fill="none" stroke="#FFE082" stroke-width="5" stroke-linecap="round"></path>
      <path d="M760 425 L782 451 L750 458" fill="none" stroke="#FFE082" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M220 470 C300 455 360 480 430 462" fill="none" stroke="#8FCDFF" stroke-opacity=".45" stroke-width="22" stroke-linecap="round"></path>
    </svg>
    <div role="toolbar" aria-label="Drawing tools" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 8px; border-radius: 32px; background: #191C20; box-shadow: 0 6px 20px rgba(0,0,0,.45)">
      <sc-for list="{{pens}}" as="p" hint-placeholder-count="8">
        <button onClick="{{p.pick}}" aria-pressed="{{p.on}}" title="{{p.tip}}" aria-label="{{p.tip}}" style="{{p.style}}">
          <span style="{{p.dot}}"></span>
        </button>
      </sc-for>
      <span aria-hidden="true" style="width: 1px; height: 28px; background: #42474E; margin: 0 6px"></span>
      <sc-for list="{{colors}}" as="c" hint-placeholder-count="4">
        <button onClick="{{c.pick}}" aria-label="{{c.name}}" aria-pressed="{{c.on}}" style="{{c.style}}"></button>
      </sc-for>
    </div>
    <div aria-live="polite" style="position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%); padding: 6px 12px; border-radius: 8px; background: #E1E2E8; color: #191C20; font-size: 13px; white-space: nowrap">{{tip}}</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { pen: 0, color: 0 }; }
  renderVals() {
    const s = this.state;
    const defs = [['Pen', 'P', 6], ['Pencil', 'N', 3], ['Marker', 'M', 10], ['Highlighter', 'H', 16], ['Brush', 'B', 12], ['Calligraphy', 'C', 8], ['Neon', 'G', 7], ['Eraser', 'E', 14]];
    const palette = [['Coral', '#FFB4AB'], ['Sun', '#FFE082'], ['Sky', '#8FCDFF'], ['Paper', '#E1E2E8']];
    const pens = defs.map((d, i) => {
      const on = s.pen === i;
      return { tip: d[0] + ' (' + d[1] + ')', on: on ? 'true' : 'false', pick: () => this.setState({ pen: i }),
        style: 'width:44px;height:44px;border:0;border-radius:22px;display:flex;align-items:center;justify-content:center;background:' + (on ? '#384956' : 'transparent'),
        dot: 'display:block;width:' + d[2] + 'px;height:' + d[2] + 'px;border-radius:50%;' + (i === 7 ? 'border:2px solid #C2C7CF;background:transparent' : 'background:' + palette[s.color][1]) };
    });
    const colors = palette.map((c, i) => ({ name: c[0], on: s.color === i ? 'true' : 'false', pick: () => this.setState({ color: i }),
      style: 'width:28px;height:28px;margin:8px 4px;border-radius:50%;background:' + c[1] + ';border:' + (s.color === i ? '3px solid #E1E2E8' : '2px solid #191C20') + ';box-shadow:' + (s.color === i ? '0 0 0 2px #191C20' : 'none') }));
    return { pens, colors, tip: defs[s.pen][0] + ' · press ' + defs[s.pen][1] + ' · hold Shift for a straight line' };
  }
}
</script>
</body>
</html>
